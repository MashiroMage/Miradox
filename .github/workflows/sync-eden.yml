name: Sync Eden master

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions: {}

concurrency:
  group: sync-eden-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Sync upstream branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Please add the UPSTREAM_SYNC_TOKEN repository secret."
            exit 1
          fi

          gh auth setup-git --hostname github.com

          git init --bare sync.git
          cd sync.git

          git remote add eden https://github.com/eden-emulator/mirror.git
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

          upstream_sha="$(git ls-remote --exit-code eden refs/heads/master | cut -f1)"
          mirror_sha="$(git ls-remote origin refs/heads/upstream/eden-master | cut -f1)"

          if [[ "$upstream_sha" == "$mirror_sha" ]]; then
            echo "Already up to date: $upstream_sha"
            exit 0
          fi

          git fetch --no-tags eden refs/heads/master:refs/remotes/eden/master
          git push origin refs/remotes/eden/master:refs/heads/upstream/eden-master

          echo "Synced upstream/eden-master successfully."
